<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Шість математичних завдань для 5 класу, що засвічують маяк.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self'; connect-src 'none'; font-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <title>Маяк п’ятого класу</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="lighthouse-scene.css">
  <script src="generator.js" defer></script>
  <script src="game-model.js" defer></script>
  <script src="lighthouse-scene.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#task">Перейти до завдання</a>
  <main class="experience">
    <section class="scene-panel" aria-label="Вигляд маяка">
      <div id="lighthouse-scene" class="lighthouse-scene" role="img" aria-label="Маяк, стан 0 із 6: усі вікна й ліхтар вимкнені.">
        <img class="scene-image scene-image-current" src="lighthouse-0.webp" width="1672" height="941" alt="" aria-hidden="true">
        <img class="scene-image scene-image-next" src="lighthouse-0.webp" width="1672" height="941" alt="" aria-hidden="true">
      </div>
    </section>

    <section id="task" class="task-panel" aria-labelledby="activity-title">
      <header id="activity-context">
        <a class="catalog-link" href="../../../">← До каталогу</a>
        <h1 id="activity-title">Маяк п’ятого класу</h1>
        <p class="instruction">Розв’яжи 6 завдань — кожна правильна відповідь засвітить маяк.</p>
      </header>

      <section id="game" class="question-card" aria-labelledby="question-title">
        <p id="progress-label" class="progress-label">Завдання 1 з 6</p>
        <h2 id="question-title" tabindex="-1"></h2>
        <div id="answer-area" class="answer-area"></div>
        <div class="actions">
          <button id="check-button" class="button primary" type="button">Перевірити</button>
          <button id="hint-button" class="button secondary" type="button">Підказка</button>
          <button id="next-button" class="button primary" type="button" hidden>Далі</button>
        </div>
        <p id="hint" class="support hint" role="status" hidden></p>
        <p id="feedback" class="support feedback" role="alert" tabindex="-1" hidden></p>
      </section>

      <section id="finale" class="finale" aria-labelledby="finale-title" hidden>
        <h2 id="finale-title" tabindex="-1">Маяк світить! Усі 6 завдань виконано.</h2>
        <button id="new-game-button" class="button primary" type="button">Нова гра</button>
      </section>

      <section id="failure" class="failure" aria-labelledby="failure-title" hidden>
        <h2 id="failure-title" tabindex="-1">Не вдалося створити завдання. Почни нову гру.</h2>
        <button id="retry-button" class="button primary" type="button">Нова гра</button>
      </section>
    </section>
  </main>
</body>
</html>
